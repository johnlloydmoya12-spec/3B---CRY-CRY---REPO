<!DOCTYPE html>
<html>
<head>
    <title>Login and Register</title>
    <link rel="stylesheet" href="script.js">
</head>
<body>

    <h1>Login</h1>
    <label>Username: <input type="text" id="username" required></label><br><p></p>
    <label>Password: <input type="text" id="password" required></label><br><p></p>
    <button id="loginbutton">Login </button> 

    <h1>Register</h1>
    <label>First Name: <input type="text" id="firstname" placeholder="Enter your First Name" required></label><br><p></p>
    <label>Last Name: <input type="text" id="lastname" placeholder="Enter your Last Name" required></label><br><p></p>
    <label>Middle Name: <input type="text" id="middlename" placeholder="Enter your Middle Name" required></label><br><p></p>
    
    <label for="gender"> Gender:</label>
    <select name="gender" id="gender">
        <option value="Select">Select</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Prefer not to say">Prefer not to say</option>
        </select><br><p></p>

    <label>Birthdate: <input type="date" id="birthdate" required></label><br><p></p>
    <label>Contact Number: <input type="text" id="contactnumber" placeholder="09XXXXXXXXX" required></label><br><p></p>
    <label>Email: <input type="text" id="email" placeholder="Name@email.com" required></label><br><p></p>
    <label>Address: <input type="text" id="address" placeholder="Enter your Address" required></label><br><p></p>
    

    <label>Username: <input type="text" id="userName" required></label><br><p></p>
    <label>Password: <input type="text" id="Password" required></label><br><p></p>
    <label>Confirm Password: <input type="text" id="confirmPassword" required></label><br><p></p>
    <button id="registerbutton">Register</button>

    <script src="script.js"></script>

</body>
</html>
